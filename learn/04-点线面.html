<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../leaflet.css" />
  <script src="../leaflet.js"></script>
</head>
<style>
  .map {
    height: 500px;
    width: 1000px;
    border: 1px solid #000;
  }
</style>
<div id="map" class="map"></div>
<script>
  var onePoint = [34.1845, 108.947]
  var twoLine = [onePoint, [34.1845, 108.948]]
  var threePolygon = [onePoint, [34.1846, 108.947], [34.1846, 108.946], onePoint]

  var satellite = L.tileLayer(
    'https://webst0{s}.is.autonavi.com/appmaptile?' +
    'style=6&x={x}&y={y}&z={z}',
    {
      subdomains: '1234'
    }
  )
  var street = L.tileLayer(
    'https://webst0{s}.is.autonavi.com/appmaptile?' +
    'style=7&x={x}&y={y}&z={z}',
    {
      subdomains: '1234'
    }
  )
  var map = L.map('map',
    {
      center: [34.1845, 108.947],
      zoom: 13,
      layers: [street]
    }
  );
  L.control.layers({
    '卫星图': satellite, '街道图': street
  }).addTo(map);
  var layerGroup = L.layerGroup().addTo(map)
  L.marker(onePoint).addTo(layerGroup)
    .bindPopup('这是一个点')
  L.polyline(twoLine).addTo(layerGroup)
    .bindPopup('这是一个线')
    .setStyle({
      color: 'red',
      weight: 3
    })
  L.polygon(threePolygon).addTo(layerGroup)
    .bindPopup('这是一个面')
    .setStyle({
      color: 'red',
      weight: 3
    })
</script>

</body>

</html>
