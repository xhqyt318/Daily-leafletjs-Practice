<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../leaflet.css" />
  <script src="../leaflet.js"></script>
</head>
<style>
  .map {
    height: 500px;
    width: 1000px;
    border: 1px solid #000;
  }
</style>

<body>
  <button id="btn">清除</button>
  <div id="map" class="map"></div>
  <script>
    var map = L.map('map').setView([39.9042, 116.4074], 13);
    var street = L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?' +
      'style=7&x={x}&y={y}&z={z}',
      {
        subdomains: '1234'
      }
    ).addTo(map);
    const btn = document.getElementById('btn');
    let points = [];
    let layerGroup = L.layerGroup().addTo(map)
    function initPoints() {
      points = JSON.parse(localStorage.getItem('points') || '[]');
      points.forEach(point => {
        const lating = [point.lat, point.lng]
        L.marker(lating).addTo(layerGroup)
          .bindPopup('经纬度:' + lating)
          .openPopup();
      })
      layerGroup.addTo(map)
    }
    initPoints();
    map.on('click', function (e) {
      points.push(e.latlng);
      localStorage.setItem('points', JSON.stringify(points));
      L.marker(e.latlng).addTo(layerGroup)
        .bindPopup('经纬度:' + e.latlng)
        .openPopup();
      layerGroup.addTo(map)
    })
    btn.addEventListener('click', function () {
      points = [];
      localStorage.setItem('points', JSON.stringify(points));
      layerGroup.clearLayers();
      initPoints();
    })
  </script>
</body>

</html>
